services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # Wymagane przez obraz apache/kafka przy nadpisywaniu domyślnej konfiguracji KRaft.
      # Wartość to dowolny poprawny identyfikator: 16 losowych bajtów zakodowanych
      # w base64url bez paddingu (można wygenerować np. `kafka-storage.sh random-uuid`).
      - CLUSTER_ID=78YOuydifzqJ4nO0T7qZZw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - kafka-net

  # Jednorazowy serwis tworzący wymagane topici zaraz po starcie brokera.
  # Logika (pętla oczekiwania + tworzenie topiców) żyje w osobnym pliku
  # kafka-init/init-topics.sh, montowanym poniżej - CELOWO nie jest wklejona
  # bezpośrednio w `command:`, bo Docker Compose robi własną podmianę
  # zmiennych typu VAR w treści YAML, co koliduje ze zmiennymi powłoki bash
  # (np. zmienną "i" w pętli for) i potrafi ubić cały skrypt bez czytelnego błędu.
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    volumes:
      - ./kafka-init/init-topics.sh:/scripts/init-topics.sh:ro
    networks:
      - kafka-net

  # Konsument – działa w tle, przetwarza wiadomości z 'orders'.
  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - kafka-net
    restart: unless-stopped

  # Producent demonstracyjny – wysyła przykładowe zamówienia.
  # Uruchamiany na żądanie: docker compose --profile demo up producer
  producer:
    build: ./producer
    container_name: producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ORDER_COUNT=10
      - INTERVAL_SECONDS=1
    networks:
      - kafka-net
    profiles: ["demo"]

  # Testy automatyczne (TypeScript, Jest + kafkajs).
  # Uruchamiane na żądanie: docker compose --profile test run --rm tests
  tests:
    build: ./tests
    container_name: kafka-tests
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      consumer:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - kafka-net
    profiles: ["test"]

  # Podgląd topiców/wiadomości w przeglądarce (http://localhost:8080).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - kafka-net
    profiles: ["ui"]

networks:
  kafka-net:
    driver: bridge
